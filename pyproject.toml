[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onec-code-search"
version = "0.1.0"
description = "Proof-of-concept search for likely change places in a 1C BSL repository."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "httpx>=0.27,<1",
    "requests>=2.32,<3",
    "weaviate-client>=4.16.4,<5",
    "python-dotenv>=1,<2",
    "pytest>=8,<9",
]

[tool.setuptools]
packages = ["api", "common", "eval", "indexer", "openwebui_tool"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
